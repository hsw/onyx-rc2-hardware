# SPDX-License-Identifier: MIT
# Minimal mke2fs.conf for partition 1 (MKE2FS_CONFIG in mkcard.py). The host's own config (e2fsprogs 1.47) adds
# huge_file flex_bg metadata_csum 64bit dir_nlink extra_isize (and more) to ext4, which the stock 3.0.36 kernel cannot
# mount. mkcard.py also passes the explicit -O list.
[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	blocksize = 4096
	inode_size = 256
	inode_ratio = 16384

[fs_types]
	ext4 = {
		features = has_journal,extent,uninit_bg
	}
	small = {
		blocksize = 4096
		inode_size = 256
		inode_ratio = 16384
	}
